services:
  postgres:
    image: postgres:16-alpine
    container_name: cnpc-promotion-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cnpc_promotion}
      POSTGRES_USER: ${POSTGRES_USER:-cnpc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cnpc}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - cnpc_promotion_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cnpc} -d ${POSTGRES_DB:-cnpc_promotion}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  cnpc_promotion_pgdata:
